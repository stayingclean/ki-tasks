[project]
name = "platzhalter"
version = "0.1.0"
description = "Platzhalter in Word-Dateien finden und ersetzen"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=5.0",
    "python-docx>=1.1",
]

[project.scripts]
platzhalter = "platzhalter.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platzhalter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
