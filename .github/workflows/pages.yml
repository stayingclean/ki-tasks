name: Zips bauen und auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  # Bei einem PR laufen nur die Tests und die beiden Programm-Builds; veröffentlicht
  # wird erst nach dem Merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: platzhalter
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Abhängigkeiten
        run: uv sync --locked
      - name: Tests
        run: uv run pytest
      - name: EXE bauen
        run: uv run pyinstaller platzhalter.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: platzhalter-exe
          path: platzhalter/dist/platzhalter.exe
          if-no-files-found: error
  # Apple-Silicon-Runner, also ein Programm für Macs mit Apple-Chip (ab 2020).
  # Nicht signiert: Beim ersten Öffnen muss man es in den Systemeinstellungen
  # freigeben, siehe anleitung/platzhalter.html.
  app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: platzhalter
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Abhängigkeiten
        run: uv sync --locked
      - name: Tests
        run: uv run pytest
      - name: App bauen
        run: uv run pyinstaller platzhalter.spec --noconfirm
      # ditto statt zip: behält Symlinks und Rechte im .app, sonst startet es nicht.
      - name: Zippen
        run: ditto -c -k --keepParent dist/Platzhalter.app dist/platzhalter-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: platzhalter-mac
          path: platzhalter/dist/platzhalter-mac.zip
          if-no-files-found: error
  build:
    needs: [exe, app]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zips bauen
        run: python build.py
      - uses: actions/download-artifact@v4
        with:
          name: platzhalter-exe
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: platzhalter-mac
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Die Seiten aus anleitung/ veröffentlicht der Deploy von stayingclean/toolbox.
  # Damit eine Änderung hier sofort drüben erscheint, stösst dieser Job ihn an.
  # Das Token stellt eine GitHub App aus, die nur auf toolbox installiert ist
  # (Repository permissions → Contents: Read and write). Einmalig einrichten:
  #   Variable TOOLBOX_APP_ID   = App-ID
  #   Secret   TOOLBOX_APP_KEY  = Private Key (.pem, ganzer Inhalt)
  # Ohne die Variable wird der Job übersprungen; drüben zieht dann der tägliche
  # Cron nach.
  toolbox:
    needs: deploy
    if: vars.TOOLBOX_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TOOLBOX_APP_ID }}
          private-key: ${{ secrets.TOOLBOX_APP_KEY }}
          owner: stayingclean
          repositories: toolbox
      - name: Toolbox-Deploy anstossen
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh api repos/stayingclean/toolbox/dispatches -f event_type=ki-tasks
